{% extends "base.html" %}
{% block title %}Add Product | Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-lg-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold mb-1">Add Product</h2>
                            <p class="text-secondary mb-0">Create a new product record.</p>
                        </div>
                        <a href="{% url 'admin_products' %}" class="btn btn-outline-secondary">Manage</a>
                    </div>

                    {% load crispy_forms_tags %}
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <div class="mt-4">
                            <button type="submit" class="btn btn-success">Save Product</button>
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
